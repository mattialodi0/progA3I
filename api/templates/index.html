<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Predict</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root{--blue:#0d6efd;--muted:#f6f8fb;--bg:#ffffff}
      *{box-sizing:border-box}
      body{font-family:Inter, "Segoe UI", Roboto, Arial, sans-serif;background:var(--muted);color:#07305a;margin:0;padding:2rem}
      .container{max-width:1100px;margin:0 auto;background:var(--bg);padding:1.25rem;border-radius:12px;box-shadow:0 8px 24px rgba(13,110,253,0.06)}
      .header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
      .logo{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--blue),#6ea8fe);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px}
      h1{margin:0;font-size:1.4rem}
      .lead{color:#234b66;margin-top:4px;font-size:0.95rem}
      .card{padding:14px;border-radius:10px;background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid #eef6ff}
      #map{height:420px;margin:0.5rem 0 1rem 0;border-radius:8px;border:1px solid #e6f0ff}
      label{display:flex;flex-direction:column;font-size:0.92rem;color:#123;margin-bottom:6px}
      input[type="number"], input[type="date"], select{padding:8px 10px;border:1px solid #d7eaff;border-radius:8px;background:#fff}
      fieldset{border:1px dashed #e6f2ff;padding:10px;border-radius:8px;margin-top:8px}
      legend{padding:0 6px;color:#0a3a6b;font-weight:600}
      .controls{display:flex;flex-wrap:wrap;gap:12px}
      .controls > label{flex:1;min-width:180px}
      button{background:var(--blue);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}
      button:hover{filter:brightness(.95)}
      #result{background:#f8fbff;padding:12px;border:1px solid #e6f4ff;border-radius:8px;color:#07264a;white-space:pre-wrap}
      #plot-img{max-width:100%;height:auto;border-radius:8px;border:1px solid #e6eefc;padding:6px;background:#fff;display:none}
      .form-error{color:#b00020;margin-top:8px}
      @media(min-width:800px){.two-cols{display:flex;gap:12px}.two-cols>.col{flex:1}}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">P</div>
        <div>
          <h1>Predict</h1>
          <div class="lead">Quickly predict event risk from location and features</div>
        </div>
      </div>
      <div class="card">
        <form id="predict-form">
      <div>
        <label>EVENT_TYPE:
          <select name="EVENT_TYPE" required>
            <option value="flood">flood</option>
            <option value="storm">storm</option>
            <option value="wildfire">wildfire</option>
            <option value="drought">drought</option>
          </select>
        </label>
      </div>

      <!-- Map picker: click to set BEGIN_LAT/BEGIN_LON -->
      <div id="map"></div>

      <div>
        <label>BEGIN_LAT: <input id="BEGIN_LAT" name="BEGIN_LAT" type="number" step="any" required readonly placeholder="click map"></label>
        <label>BEGIN_LON: <input id="BEGIN_LON" name="BEGIN_LON" type="number" step="any" required readonly placeholder="click map"></label>
      </div>

      <div>
        <label>DURATION_HOURS: <input name="DURATION_HOURS" type="number" step="any" value="1" required></label>
        <label>WIND_SPEED: <input name="WIND_SPEED" type="number" step="any" value="0" required></label>
      </div>
      <div>
        <label>DATE: <input name="DATE" type="date" value="2023-01-01" required></label>
        <label>PRECIPITATION: <input name="PRECIPITATION" type="number" step="any" value="100" required></label>
      </div>
      <div>
        <label>TMIN: <input name="TMIN" type="number" step="any" value="0" required></label>
        <label>TMAX: <input name="TMAX" type="number" step="any" value="30" required></label>
      </div>
      <div>
        <label>ELEVATION: <input name="ELEVATION" type="number" step="any" value="100" required></label>
        <label>SLOPE: <input name="SLOPE" type="number" step="any" value="0" required></label>
      </div>
      <fieldset>
        <legend>Land cover fractions (must sum to 1)</legend>
        <label>COV_BARREN: <input name="COV_BARREN" type="number" step="any" min="0" max="1" value="0" required></label>
        <label>COV_CULTIVATED: <input name="COV_CULTIVATED" type="number" step="any" min="0" max="1" value="0" required></label>
        <label>COV_VEGETATION: <input name="COV_VEGETATION" type="number" step="any" min="0" max="1" value="1" required></label>
        <label>COV_FOREST: <input name="COV_FOREST" type="number" step="any" min="0" max="1" value="0" required></label>
        <label>COV_WATER: <input name="COV_WATER" type="number" step="any" min="0" max="1" value="0" required></label>
        <label>COV_SNOW_ICE: <input name="COV_SNOW_ICE" type="number" step="any" min="0" max="1" value="0" required></label>
        <label>COV_URBAN: <input name="COV_URBAN" type="number" step="any" min="0" max="1" value="0" required></label>
      </fieldset>

      <div>
        <label>RIVER_DISTANCE: <input name="RIVER_DISTANCE" type="number" step="any" value="10" required></label>
        <label>SEA_DISTANCE: <input name="SEA_DISTANCE" type="number" step="any" value="100" required></label>
      </div>

          <div style="margin-top:10px;">
            <button type="submit">Predict</button>
          </div>
        </form>
      </div>
      <div id="form-error" class="form-error"></div>

      <h2 style="margin-top:18px">Result</h2>
      <pre id="result">No result yet</pre>
      <div style="margin-top:8px">
        <img id="plot-img" alt="predictive plot" />
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // Initialize Leaflet map centered on the contiguous United States
      const map = L.map('map').setView([39.8283, -98.5795], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      let marker = null;
      function setMarker(lat, lon){
        if(marker){ marker.setLatLng([lat, lon]); }
        else { marker = L.marker([lat, lon]).addTo(map); }
        // update inputs
        const latInput = document.getElementById('BEGIN_LAT');
        const lonInput = document.getElementById('BEGIN_LON');
        if(latInput) latInput.value = Number(lat).toFixed(6);
        if(lonInput) lonInput.value = Number(lon).toFixed(6);
      }

      map.on('click', function(e){
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;
        setMarker(lat, lon);
      });

      // try to place a default marker
      setMarker(39.8283, -98.5795);

      // Form handling and validation
      const form = document.getElementById('predict-form');
      const result = document.getElementById('result');
      const formError = document.getElementById('form-error');

      function parseNumber(v){
        const n = parseFloat(v);
        return Number.isFinite(n) ? n : null;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        formError.textContent = '';

        // Validate cov sum
        const covNames = ['COV_BARREN','COV_CULTIVATED','COV_VEGETATION','COV_FOREST','COV_WATER','COV_SNOW_ICE','COV_URBAN'];
        let sum = 0.0;
        for(const name of covNames){
          const v = form.elements[name].value;
          const n = parseNumber(v);
          if(n === null){
            formError.textContent = 'All coverage fields must be numeric.';
            return;
          }
          if(n < 0){
            formError.textContent = 'Coverage fractions must be >= 0.';
            return;
          }
          sum += n;
        }
        if(Math.abs(sum - 1.0) > 1e-3){
          formError.textContent = 'Coverage fractions must sum to 1 (currently ' + sum.toFixed(4) + ').';
          return;
        }

        const formData = new FormData(form);
        const resp = await fetch('/predict', {
          method: 'POST',
          body: formData
        });
        const data = await resp.json();
        if(!resp.ok){
          formError.textContent = data.error || 'Server returned an error';
        }
        console.log('Response:', data);
        result.textContent = JSON.stringify(data, null, 2);
        const img = document.getElementById('plot-img');
        if(data && data.prediction && data.prediction.plot){
          img.src = data.prediction.plot;
          img.style.display = 'block';
        } else {
          img.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
